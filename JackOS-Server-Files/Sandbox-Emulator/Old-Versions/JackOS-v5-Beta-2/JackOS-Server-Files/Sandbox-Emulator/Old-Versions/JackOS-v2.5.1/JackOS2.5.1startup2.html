<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JackOS Activation</title>
<style>
    body {
        background-color: #000;
        color: #00bfff; /* Baby blue */
        font-family: monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        flex-direction: column;
        text-align: center;
    }
    .fade-text {
        font-size: 36px;
        opacity: 0;
        transition: opacity 2s ease;
    }
</style>
</head>
<body>

<div id="main-text" class="fade-text">
    🐵<br>JackOS<br>v2.5.1
</div>

<script>
// Fade in text
const mainText = document.getElementById("main-text");
setTimeout(() => {
    mainText.style.opacity = 1; // Fade in
}, 500);

// Fade out after 3 seconds visible
setTimeout(() => {
    mainText.style.opacity = 0; // Fade out
    setTimeout(() => {
        window.location.href = "JackOS2.5.1Login.html"; // Redirect after fade-out
    }, 2000); // Wait for fade-out animation
}, 3500); // Visible for 3s after fade-in
</script>

</body>
</html>
