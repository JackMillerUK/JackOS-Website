<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JackOS Login</title>
<style>
   body {
    margin: 0;
    font-family: Segoe UI, Arial, sans-serif;
    background: url('Yo.png') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


    .login-container {
        text-align: center;
        background: rgba(255,255,255,0.15);
        padding: 40px;
        border-radius: 12px;
        backdrop-filter: blur(8px);
        width: 300px;
    }

    .profile-circle {
        width: 120px;
        height: 120px;
        background: rgba(255,255,255,0.3);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
        margin: 0 auto 10px;
    }

    #current-user {
        color: black;
        background: rgba(255,255,255,0.8);
        display: block;
        padding: 8px 0;
        border-radius: 6px;
        font-weight: bold;
        margin: 10px auto 20px;
        width: 80%;
    }

    input[type="password"] {
        width: 80%;
        padding: 10px;
        font-size: 18px;
        border: none;
        border-radius: 4px;
        margin-bottom: 15px;
        text-align: center;
    }

    button {
        width: 85%;
        padding: 10px;
        font-size: 18px;
        background: #0078D7;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background: #005a9e;
    }

    #message {
        margin-top: 15px;
        font-size: 18px;
    }

    .loading {
        display: inline-block;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .user-options {
        position: absolute;
        bottom: 20px;
        left: 20px;
        display: flex;
        gap: 15px;
    }

    .user-btn {
        background: rgba(0,0,0,0.5);
        color: #fff;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
    }

    .user-btn:hover {
        background: rgba(0,0,0,0.7);
    }
</style>
</head>
<body>
<div class="login-container">
    <div class="profile-circle">👤</div>
    <div id="current-user">Jack</div>
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="message"></p>
</div>

<div class="user-options">
    <div class="user-btn" onclick="switchUser('Jack')">Jack</div>
    <div class="user-btn" onclick="switchUser('Andreas')">Andreas</div>
</div>

<script>
let currentUser = "Jack";

function switchUser(user) {
    currentUser = user;
    document.getElementById('current-user').textContent = user;
    document.getElementById('password').value = "";
    document.getElementById('message').textContent = "";
}

function login() {
    const password = document.getElementById('password').value.trim();
    const message = document.getElementById('message');

    message.innerHTML = "";

    // Check password based on current user
    if ((currentUser === "Jack" && password === "Jack is a legend") ||
        (currentUser === "Andreas" && password === "Monkey King")) {
        
        message.style.color = "#4CAF50";
        message.innerHTML = "✅ Welcome " + currentUser + " <span class='loading'>⏳</span>";
        setTimeout(() => {
            window.location.href = "JackOS2.5.1Home.html";
        }, 2000);
    } else {
        message.style.color = "red";
        message.innerHTML = "❌ The password is incorrect";
    }
}

</script>
</body>
</html>
